<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover lets us use the full screen around the notch; we pad with safe-area insets.
     user-scalable/maximum-scale are honoured by Android; iOS ignores them, so CSS touch-action + JS guards handle iOS. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b5e3a">
<meta name="description" content="Dino Drop: a falling-blocks puzzle game for kids, with dinosaurs.">
<!-- iOS home-screen app settings -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dino Drop">
<!-- stop iOS turning numbers into phone links -->
<meta name="format-detection" content="telephone=no">
<title>Dino Drop</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="portrait">

  <!-- ===== Game screen ===== -->
  <main id="game" aria-label="Dino Drop game">
    <header id="topbar">
      <button class="icon-btn" id="btn-pause" aria-label="Pause">
        <svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>
      </button>
      <div class="stat big"><span class="label">Score</span><span id="score">0</span></div>
      <div class="stat"><span class="label">Best</span><span id="best">0</span></div>
      <button class="icon-btn" id="btn-sound" aria-label="Sound effects on/off"></button>
      <button class="icon-btn" id="btn-music" aria-label="Music on/off"></button>
    </header>

    <section id="playfield">
      <div id="board-wrap"><canvas id="board"></canvas></div>
      <aside id="side">
        <div class="panel" id="next-panel">
          <span class="label">Next</span>
          <canvas id="next"></canvas>
          <span id="next-name"></span>
        </div>
        <div class="panel small"><span class="label">Level</span><span id="level">1</span></div>
        <div class="panel small"><span class="label">Rows</span><span id="lines">0</span></div>
        <div class="panel small" id="mode-badge"></div>
        <button class="panel power empty" id="power-btn" hidden aria-label="Power">
          <canvas id="power-icon" aria-hidden="true"></canvas>
          <span class="p-name" id="power-name">Power</span>
          <span class="p-bar" aria-hidden="true"><i id="power-fill"></i></span>
        </button>
        <div class="panel small" id="save-panel" hidden aria-live="polite">
          <span class="label">Save</span>
          <svg id="save-egg" viewBox="0 0 40 48" aria-hidden="true">
            <path class="shell" d="M20 3C10 3 4 18 4 29c0 9 7 16 16 16s16-7 16-16C36 18 30 3 20 3z"/>
            <path class="crack" d="M5 26 L12 21 L17 28 L23 20 L28 27 L35 22"/>
            <circle class="spot" cx="14" cy="16" r="2.6"/><circle class="spot" cx="25" cy="12" r="2"/><circle class="spot" cx="27" cy="33" r="2.4"/>
          </svg>
        </div>
      </aside>
    </section>

    <nav id="controls" aria-label="Controls">
      <button class="ctl" data-action="left" aria-label="Move left" style="--c:#29b6f6">
        <svg viewBox="0 0 48 48"><path d="M30 8 L12 24 L30 40 Z"/></svg>
      </button>
      <button class="ctl" data-action="right" aria-label="Move right" style="--c:#29b6f6">
        <svg viewBox="0 0 48 48"><path d="M18 8 L36 24 L18 40 Z"/></svg>
      </button>
      <button class="ctl" data-action="rotate" aria-label="Turn" style="--c:#ab47bc">
        <svg viewBox="0 0 48 48"><path d="M24 8a16 16 0 1 1-15.2 11" fill="none" stroke-width="6" stroke-linecap="round"/><path d="M2 14 L12 26 L18 11 Z"/></svg>
      </button>
      <button class="ctl" data-action="down" aria-label="Drop faster (hold)" style="--c:#ff9800">
        <svg viewBox="0 0 48 48"><path d="M8 14 L24 30 L40 14 Z"/><rect x="10" y="34" width="28" height="6" rx="3"/></svg>
      </button>
    </nav>
  </main>

  <!-- ===== Menu ===== -->
  <section id="menu" class="overlay show">
    <div class="card">
      <canvas id="title-art" aria-hidden="true"></canvas>
      <h1>Dino Drop</h1>
      <p class="sub">Pick how fast the dinos fall!</p>
      <div id="modes">
        <button class="mode" data-mode="easy" style="--c:#4fc3f7">
          <canvas data-dino="I"></canvas>
          <span class="mode-name">Easy</span>
          <span class="mode-best" data-best="easy"></span>
        </button>
        <button class="mode" data-mode="medium" style="--c:#b388ff">
          <canvas data-dino="T"></canvas>
          <span class="mode-name">Medium</span>
          <span class="mode-best" data-best="medium"></span>
        </button>
        <button class="mode" data-mode="hard" style="--c:#ffa726">
          <canvas data-dino="L"></canvas>
          <span class="mode-name">Hard</span>
          <span class="mode-best" data-best="hard"></span>
        </button>
        <button class="mode puzzle" id="btn-puzzle" style="--c:#26a69a">
          <canvas data-pip="1"></canvas>
          <span class="mode-name">Puzzles</span>
          <span class="mode-best" id="puzzle-progress"></span>
        </button>
      </div>
      <p class="hint" id="install-hint"></p>
      <button class="text-btn" id="btn-install" hidden>Install on this phone</button>
      <p class="hint">No sound? Check the phone isn't on silent.</p>
    </div>
  </section>

  <!-- ===== Pause ===== -->
  <section id="pause" class="overlay">
    <div class="card">
      <h2>Paused</h2>
      <button class="big-btn go" id="btn-resume">Keep playing</button>
      <button class="big-btn" id="btn-restart" hidden>Start level again</button>
      <button class="big-btn" id="btn-quit">Main menu</button>
    </div>
  </section>

  <!-- ===== Game over ===== -->
  <section id="over" class="overlay">
    <div class="card">
      <canvas id="over-art" aria-hidden="true"></canvas>
      <h2>Great game!</h2>
      <p class="final">Score <strong id="final-score">0</strong></p>
      <p class="newbest" id="newbest" hidden>New best score!</p>
      <button class="big-btn go" id="btn-again">Play again</button>
      <button class="big-btn" id="btn-menu">Main menu</button>
    </div>
  </section>

  <!-- ===== Game options (before Easy / Medium / Hard) ===== -->
  <section id="options" class="overlay">
    <div class="card">
      <div class="card-head">
        <button class="back-btn" id="opt-back" aria-label="Back">
          <svg viewBox="0 0 24 24"><path d="M15 4 L7 12 L15 20" fill="none" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <h2 id="opt-title">Easy</h2>
      </div>
      <canvas id="opt-art" aria-hidden="true"></canvas>
      <button class="toggle" id="opt-powers" role="switch" aria-checked="false">
        <svg class="t-icon" viewBox="0 0 48 48" aria-hidden="true"><path d="M40 6 L22 22" stroke="#ffb74d" stroke-width="7" stroke-linecap="round"/><path d="M34 4 L18 18" stroke="#ffe082" stroke-width="4" stroke-linecap="round"/><circle cx="16" cy="30" r="12" fill="#8d6e63" stroke="#2b1f3a" stroke-width="3"/><circle cx="12" cy="27" r="3" fill="#6d4c41"/><circle cx="20" cy="34" r="2.4" fill="#6d4c41"/></svg>
        <span class="t-text"><b>Powers</b><small>Earn a Meteor, Volcano or Egg Bomb every 2,000 points</small></span>
        <span class="switch" aria-hidden="true"></span>
      </button>
      <button class="toggle" id="opt-cascade" role="switch" aria-checked="false">
        <svg class="t-icon" viewBox="0 0 48 48" aria-hidden="true"><rect x="6" y="4" width="14" height="14" rx="4" fill="#4fc3f7" stroke="#2b1f3a" stroke-width="3"/><path d="M13 22 v8 m-4 -4 l4 4 4 -4" stroke="#2b1f3a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="6" y="32" width="14" height="12" rx="4" fill="#4fc3f7" stroke="#2b1f3a" stroke-width="3"/><rect x="22" y="32" width="20" height="12" rx="4" fill="#ffa726" stroke="#2b1f3a" stroke-width="3"/></svg>
        <span class="t-text"><b>Cascade</b><small>After a row clears, loose blocks tumble down. Chain reactions!</small></span>
        <span class="switch" aria-hidden="true"></span>
      </button>
      <button class="big-btn go" id="opt-play">Play!</button>
    </div>
  </section>

  <!-- ===== Puzzle: zone map ===== -->
  <section id="zones" class="overlay">
    <div class="card wide">
      <div class="card-head">
        <button class="back-btn" id="zones-back" aria-label="Back">
          <svg viewBox="0 0 24 24"><path d="M15 4 L7 12 L15 20" fill="none" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <h2>Puzzles</h2>
      </div>
      <p class="sub small">Help Pip get home to the nest!</p>
      <div id="zone-list"></div>
    </div>
  </section>

  <!-- ===== Puzzle: level picker ===== -->
  <section id="levels" class="overlay">
    <div class="card wide">
      <div class="card-head">
        <button class="back-btn" id="levels-back" aria-label="Back to zones">
          <svg viewBox="0 0 24 24"><path d="M15 4 L7 12 L15 20" fill="none" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <h2 id="levels-title">Zone</h2>
      </div>
      <div id="level-grid"></div>
    </div>
  </section>

  <!-- ===== Puzzle: result ===== -->
  <section id="pz-over" class="overlay">
    <div class="card">
      <canvas id="pz-art" aria-hidden="true"></canvas>
      <h2 id="pz-title">Home!</h2>
      <p class="sub" id="pz-sub"></p>
      <div class="stars" id="pz-stars"></div>
      <p class="final" id="pz-bonus"></p>
      <button class="big-btn go" id="pz-next">Next level</button>
      <button class="big-btn go" id="pz-retry">Try again</button>
      <button class="big-btn" id="pz-map">Level map</button>
    </div>
  </section>

  <!-- shown when a phone is turned sideways and there isn't room to play -->
  <section id="rotate-hint" class="overlay">
    <div class="card"><h2>Turn the phone upright</h2><p class="sub">Dino Drop plays best standing tall.</p></div>
  </section>
</div>

<script src="dinos.js"></script>
<script src="puzzle-core.js"></script>
<script src="puzzle-levels.js"></script>
<script src="game.js"></script>
</body>
</html>
